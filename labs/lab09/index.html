<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PHYS 311 Lab 9 -- Collisions and Gravity</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<h1>PHYS 311 Lab 9 -- Collisions and Gravity</h1>

<canvas id="sim" width="900" height="520"></canvas>

<div class="panel">
  <label>Scene
    <select id="scene">
      <option value="projectile">Projectile</option>
      <option value="orbit">Orbits</option>
      <option value="billiards">Billiards</option>
      <option value="box">Box</option>>
      <option value="aniso">2D Oscillator</option>
    </select>
  </label>

  <div id="sceneOptionControl">
    <label id="sceneOptionLabel" for="sceneOption">
      Drag Model
    </label>
    <select id="sceneOption"></select>
  </div>

  <div id="parameterControl">
    <label id="parameterLabel" for="sceneParameter">Parameter</label>
    <input
      type="number"
      id="sceneParameter"
      value="0.01"
    >
  </div>

  <label>Integrator
    <select id="integrators">
      <option value="verlet">Velocity Verlet</option>
      <option value="euler-cromer">Euler-Cromer</option>
      <option value="euler">Euler</option>
    </select>
  </label>
  <label>DT
    <select id="dt">
      <option value="240">1/240 s</option>
      <option value="120">1/120 s</option>
      <option value="60">1/60 s</option>
      <option value="20">1/20 s (coarse)</option>
    </select>
  </label>
  <button id="pause">Pause</button>
  <button id="reset">Reset</button>
  <button id="lag">Lag</button>
</div>

<script type="module" src="main.js"></script>

</body>
</html>
