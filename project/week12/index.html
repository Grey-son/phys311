<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gravity Slingshot</title>
  <style>
    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #1e1e1e;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    }

    #sim {
      display: block;
      width: 100vw;
      height: 100vh;
      touch-action: none;
      cursor: crosshair;
    }

    #readout {
      position: fixed;
      left: 14px;
      bottom: 12px;
      margin: 0;
      padding: 7px 10px;
      color: #e5e7eb;
      background: rgb(20 20 20 / 78%);
      border: 1px solid #555;
      border-radius: 5px;
      font: 12px/1.4 ui-monospace, SFMono-Regular, Consolas, monospace;
      pointer-events: none;
    }

    #stroke-count {
      position: fixed;
      top: 14px;
      right: 14px;
      margin: 0;
      padding: 8px 12px;

      color: #e5e7eb;
      background: rgba(20, 20, 20, 0.85);

      border: 1px solid #555;
      border-radius: 5px;

      font: 600 14px/1.4 monospace;

      pointer-events: none;
      z-index: 5;
    }

    #win-overlay {
      position: fixed;
      inset: 0;

      display: none;

      align-items: center;
      justify-content: center;

      padding: 20px;

      background: rgba(0, 0, 0, 0.7);

      z-index: 100;
    }

    #win-overlay.visible {
      display: flex;
    }

    #win-popup {
      width: min(360px, 100%);
      padding: 26px;

      color: #e5e7eb;
      text-align: center;

      background: #252a32;

      border: 1px solid #7c8798;
      border-radius: 12px;

      box-shadow: 0 18px 60px rgba(0, 0, 0, 0.45);
    }

    #win-popup h1 {
      margin: 0 0 8px;
      color: #22c55e;
      font-size: 28px;
    }

    #win-popup p {
      margin: 8px 0 20px;
      color: #cbd5e1;
    }

    #reset-button {
      border: 0;
      border-radius: 6px;

      padding: 10px 20px;

      color: white;
      background: #238b69;

      font: 600 15px system-ui, sans-serif;

      cursor: pointer;
    }

    #reset-button:hover {
      background: #1b7055;
    }
  </style>
</head>

<body>
  <canvas id="sim"></canvas>

  <p id="readout" aria-live="polite">
    Drag the small body to aim, release to launch
  </p>
<p id="stroke-count" aria-live="polite">
    Strokes: 0
</p>

<div id="win-overlay"
  role="dialog"
  aria-modal="true"
  aria-labelledby="win-title">

  <div id="win-popup">
    <h1 id="win-title">You made it!</h1>

    <p id="win-message">
      Completed in 0 strokes.
    </p>

    <button id="reset-button" type="button">
      Play again
    </button>
  </div>
</div>

  <script type="module" src="main.js"></script>
</body>
</html>
