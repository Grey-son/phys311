<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport"
     content="width=device-width, initial-scale=1">

  <title>Orbital Golf</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- ===================================== -->
  <!-- MAIN MENU -->
  <!-- ===================================== -->

  <section id="main-menu" class="screen active">

    <div class="menu-content">

      <div class="game-logo">
        <span class="logo-icon">◉</span>
        <h1>Orbital<br>Golf</h1>
      </div>

      <p class="subtitle">
        A classic game - in space
      </p>

      <div class="menu-buttons">

        <button id="play-button" class="primary-button">
          PLAY
        </button>

        <button id="levels-button" class="secondary-button">
          LEVEL SELECT
        </button>

      </div>

      <p class="menu-footer">
        Use gravity. Control momentum. Reach the portal.
      </p>

    </div>

  </section>


  <!-- ===================================== -->
  <!-- LEVEL SELECT -->
  <!-- ===================================== -->

  <section id="level-select" class="screen">

    <div class="level-menu">

      <header class="screen-header">

        <button id="back-menu" class="back-button">
          ← BACK
        </button>

        <h1>SELECT LEVEL</h1>

        <span class="header-spacer"></span>

      </header>

      <div id="level-grid" class="level-grid">
        <!-- Generated by screens.js -->
      </div>

    </div>

  </section>


  <!-- ===================================== -->
  <!-- GAME -->
  <!-- ===================================== -->

  <section id="game-view" class="screen game-screen">

    <canvas id="sim"></canvas>

    <div class="game-topbar">

      <button id="game-levels" class="game-button">
        LEVELS
      </button>

      <button id="restart-button" class="game-button">
        RESTART
      </button>

      <button id="game-menu" class="game-button">
        MENU
      </button>

    </div>

    <p id="readout" aria-live="polite">
      Drag the projectile to aim.
    </p>

    <p id="stroke-count">
      Strokes: 0
    </p>


    <!-- Victory overlay -->

    <div id="win-overlay"
       role="dialog"
       aria-modal="true"
       aria-labelledby="win-title">

      <div id="win-popup">

        <h1 id="win-title">LEVEL COMPLETE!</h1>

        <p id="win-message">
          Completed in 0 strokes.
        </p>

        <div class="win-buttons">

          <button id="next-level-button"
              class="primary-button">
            NEXT LEVEL
          </button>

          <button id="win-levels-button"
              class="secondary-button">
            LEVEL SELECT
          </button>

          <button id="win-menu-button"
              class="secondary-button">
            MAIN MENU
          </button>

        </div>

      </div>

    </div>

  </section>


  <script type="module" src="main.js"></script>

</body>
</html>
